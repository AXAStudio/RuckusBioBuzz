plugins {
    id 'base'
    id 'java-base'
    id 'idea'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCommand = isWindows ? 'npm.cmd' : [
        System.getenv('NPM'),
        '/opt/homebrew/bin/npm',
        '/usr/local/bin/npm',
        '/usr/bin/npm',
        *(System.getenv('PATH') ?: '').split(File.pathSeparator).collect { "${it}/npm" }
].find { it != null && file(it).canExecute() } ?: 'npm'

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = ['public']
    }
}

idea {
    module {
        sourceDirs += file('src')
        resourceDirs += file('public')
        excludeDirs += [
            file('node_modules'),
            file('dist'),
            file('build'),
            file('.svelte-kit')
        ] as Set
    }
}

tasks.register('npmInstall', Exec) {
    group = 'pedro visualizer'
    description = 'Install Pedro visualizer npm dependencies.'
    commandLine npmCommand, 'ci'
}

tasks.register('npmBuild', Exec) {
    group = 'pedro visualizer'
    description = 'Build the Pedro visualizer web app.'
    dependsOn 'npmInstall'
    commandLine npmCommand, 'run', 'build'
}

tasks.register('npmDev', Exec) {
    group = 'pedro visualizer'
    description = 'Start the Pedro visualizer dev server at http://127.0.0.1:5173/.'
    dependsOn 'npmInstall'
    commandLine npmCommand, 'run', 'dev', '--', '--host', '127.0.0.1', '--port', '5173'
}

tasks.register('npmBuildMcp', Exec) {
    group = 'pedro visualizer'
    // Deliberately not `dependsOn npmInstall`: this only needs esbuild, which
    // is already in node_modules, and `npm ci` wipes and refetches the whole
    // tree for a 150ms bundle. On a fresh checkout, run `npm ci` (or
    // `./gradlew :PedroVisualizer:npmInstall`) once first.
    description = 'Build the Pedro Path MCP server bundle (mcp/dist/pedro-path-mcp.mjs).'
    commandLine npmCommand, 'run', 'build:mcp'
}

tasks.register('pathMcp') {
    group = 'pedro visualizer'
    description = 'Build the Pedro Path MCP server and print how to register it with Claude.'
    dependsOn 'npmBuildMcp'
    doLast {
        def bundle = file('mcp/dist/pedro-path-mcp.mjs').absolutePath
        def jsonPath = groovy.json.JsonOutput.toJson(bundle)
        println ''
        println 'Pedro Path MCP built: ' + bundle
        println ''
        println 'Claude Code:'
        println '  claude mcp add pedro-path -- node "' + bundle + '"'
        println ''
        println 'Claude Desktop (Settings -> Developer -> Edit Config), inside "mcpServers":'
        println '  "pedro-path": {'
        println '    "command": "node",'
        println '    "args": [' + jsonPath + ']'
        println '  }'
        println ''
        println 'Rebuild after changing anything under src/utils - the bundle is a copy.'
        println 'See tools/pedro-visualizer/mcp/README.md.'
    }
}

tasks.register('visualizer', Exec) {
    group = 'pedro visualizer'
    description = 'Install dependencies, start the Pedro visualizer, and open it in your browser.'
    dependsOn 'npmInstall'
    commandLine npmCommand, 'run', 'dev', '--', '--host', '127.0.0.1', '--port', '5173', '--open'
}

tasks.named('assemble') {
    dependsOn 'npmBuild'
}

// Android Studio's "Rebuild Project" asks every module for `testClasses`. This module applies only
// `java-base` and declares a `main` source set, so no `test` source set - and therefore no
// `testClasses` task - is ever created, and the whole rebuild fails before it starts. There are no
// JVM tests here (this builds through npm), so a no-op lifecycle task is enough to satisfy the IDE.
tasks.register('testClasses') {
    group = 'verification'
    description = 'No-op: this module builds through npm and has no JVM tests.'
}
