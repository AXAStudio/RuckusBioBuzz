name: Build

"on":
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.7 (this repo's build.gradle) requires JDK 17 to run Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Installs the Android SDK and pre-accepts its licenses, so Gradle/AGP can silently
      # auto-download whatever compileSdk/build-tools/NDK versions build.common.gradle asks for
      # (compileSdk 34, ndkVersion 21.3.6528147) without an interactive `sdkmanager --licenses`.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Builds :TeamCode's debug APK. TeamCode depends on :FtcRobotController
      # (implementation project(':FtcRobotController')), so this transitively compiles and
      # packages that module too. Deliberately scoped away from the :PedroVisualizer /
      # :PollenCameraTester tool subprojects (Node-based dev tools, not part of the robot app).
      - name: Build TeamCode debug APK
        run: ./gradlew :TeamCode:assembleDebug --stacktrace
