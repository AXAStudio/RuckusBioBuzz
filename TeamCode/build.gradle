
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // Lets non-.java files that live next to the source (e.g. config.jsonc) get bundled onto the
    // runtime classpath so they can be read on-device via Class#getResourceAsStream at OpMode init.
    sourceSets {
        main {
            resources.srcDirs += ['src/main/java']
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')
    // Pedro 3.0.0, substituted by the vendored build (settings.gradle includeBuild).
    implementation 'com.pedropathing:revhub:3.0.0'
    implementation 'com.pedropathing:telemetry:1.0.0'
    // Pedro 3 tuners (AutoTune). Its revhub:3.0.0 dependency resolves to the vendored build too.
    implementation 'com.pedropathing:tuning:1.0.0'
    implementation 'com.bylazar:fullpanels:1.0.12'
    implementation 'com.acmerobotics.dashboard:dashboard:0.5.1'
}
